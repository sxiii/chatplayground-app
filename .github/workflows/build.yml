name: Build Android App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          java-package: jdk

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('**/gradle.properties', '**/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: latest
          packages: >-
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Write local.properties SDK path
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Set Android env variables
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # NOTE: keep the Gradle log at its default (lifecycle) verbosity.
      # --debug produced ~17k-line logs that were unreadable without admin
      # log access. --stacktrace still surfaces task-level causes.
      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --console=plain

      - name: Run Unit Tests
        continue-on-error: true
        run: |
          ./gradlew testDebugUnitTest --no-daemon --stacktrace --console=plain

      - name: Verify Dependencies
        run: |
          ./gradlew androidDependencies --stacktrace --console=plain

      - name: Generate JaCoCo coverage report
        if: always()
        continue-on-error: true
        run: |
          ./gradlew jacocoTestReport --stacktrace --console=plain

      - name: Debug JaCoCo Files
        if: always()
        run: |
          echo "--- JaCoCo Debugging ---"
          echo "Checking for .exec files in all build directories:"
          find app/build -name "*.exec" || echo "No .exec files found"
          echo "Checking for Jacoco HTML reports:"
          find app/build -path "*/jacoco/jacocoTestReport/html/*" || echo "No Jacoco HTML reports found"
          echo "Checking build directory structure:"
          ls -R app/build | head -n 20
          echo "------------------------"

      - name: Upload JaCoCo Execution Data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-exec-data
          path: |
            app/build/jacoco/*.exec
            app/build/intermediates/unit_test_coverage/**/*.exec
            app/build/outputs/unit_test_coverage/**/*.exec

      - name: Upload JUnit Test Results
        if: always()
        run: |
          # Collect per-test XML results so failures are inspectable without admin log access.
          mkdir -p junit-results
          find app/build/test-results -name '*.xml' -print -exec cp {} junit-results/ \; || true
          if [ -z "$(ls -A junit-results)" ]; then
            echo "(no JUnit XML results produced)"
          else
            echo "JUnit XML results:"; ls -la junit-results
          fi

      - name: Run Lint
        run: |
          set -o pipefail
          ./gradlew lint --stacktrace --console=plain
          if grep -q "warning" app/build/reports/lint-results.html; then
            echo "::error Lint warnings found"
            exit 1
          fi

      - name: Unit Test Diagnostics
        if: failure()
        run: |
          echo "## Unit Test Diagnostics" >> "$GITHUB_STEP_SUMMARY"
          echo "Unit tests failed. Check the GitHub Actions job console for Gradle's failure output." >> "$GITHUB_STEP_SUMMARY"

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --console=plain

      - name: Assert APK Artifacts Exist
        run: |
          set -e
          for f in app/build/outputs/apk/debug/app-debug.apk \
                   app/build/outputs/apk/release/app-release-unsigned.apk; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Expected build artifact is missing: $f"
              exit 1
            fi
            echo "Artifact present: $f ($(du -h "$f" | cut -f1))"
          done

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chatplayground-apk-outputs
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
        if: always()

  release-tag:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Release Tag
        run: |
          git config user.name "Hermes Agent"
          git config user.email "hermes@localhost"
          TAG="release-$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
          if git rev-parse --verify "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally; skipping creation."
          else
            git tag -a "$TAG" -m "Automated release tag $TAG"
          fi
          git push origin "$TAG" 2>/dev/null || echo "Tag already on remote; nothing to push."

# JVM arguments for the Gradle build (larger heap for Compose + Kotlin).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Required: this app depends on AndroidX artifacts (androidx.*, compose, webkit)
# and AGP 8.x defaults android.useAndroidX to false. Without this, a clean CI
# build fails during configuration with:
#   "This project uses AndroidX dependencies, but the property
#    'android.useAndroidX' is not set to true."
android.useAndroidX=true

# Speed up CI: enable the local build cache and parallel task execution.
org.gradle.caching=true
org.gradle.parallel=true

# Standardized toolchain versions (single source of truth for CI stability).
# Verified compatible matrix: AGP 8.2.0 + Gradle 8.5 + Kotlin 1.9.0 + JDK 17.
#   - AGP 8.2 requires Gradle 8.0+ (wrapper pins 8.5).
#   - Kotlin 1.9.0 supports JVM target 17 max; JDK 21 is unsupported (keep JDK 17).
# Do not bump any single component without checking AGP/Kotlin/Gradle compatibility.
agpVersion=8.2.0
kotlinVersion=1.9.0
gradleVersion=8.5

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'jacoco'
    id 'org.jmailen.kotlinter' version '4.3.0'
}

android {
    namespace 'com.chatplayground.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.chatplayground.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    testOptions {
        unitTests.all {
            // JUnit 4 (no useJUnitPlatform()).
            // JaCoCo is configured at the task level via jacocoTestReport task below.
        }
        unitTests.includeAndroidResources = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // AGP 8 defaults buildConfig generation off. The app needs
    // `BuildConfig.DEBUG` as the single source of truth for debug-only
    // behaviour such as WebView remote debugging.
    buildFeatures {
        buildConfig true
    }
}

jacoco {
    toolVersion = '0.8.11'
}

// Register the report explicitly because the Android unit-test task is not
// wired to a JaCoCo report task by the Java plugin.
tasks.register('jacocoTestReport', org.gradle.testing.jacoco.tasks.JacocoReport) {
    enabled = true
    dependsOn 'testDebugUnitTest'

    executionData.setFrom(
            fileTree(dir: "$buildDir/jacoco", include: ['*.exec'])
    )

    classDirectories.setFrom(files(
            fileTree(dir: "$buildDir/tmp/kotlin-classes/debug", exclude: [
                    '**/R.class',
                    '**/R$*.class',
                    '**/BuildConfig.*',
                    '**/Manifest*.*',
                    '**/*Test*.*'
            ])
    ))
    sourceDirectories.setFrom(files('src/main/java', 'src/main/kotlin'))
    reports {
        xml.required = true
        html.required = true
        csv.required = false
        xml.destination file("${buildDir}/reports/jacoco/jacocoTestReport.xml")
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-compose:1.8.0'
    implementation platform('androidx.compose:compose-bom:2023.08.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.webkit:webkit:1.12.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.security:security-crypto:1.1.0'
    implementation 'androidx.biometric:biometric:1.1.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'org.robolectric:robolectric:4.18.1'
    testImplementation 'io.mockk:mockk:1.13.9'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'jacoco'
}

android {
    namespace 'com.chatplayground.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.chatplayground.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    testOptions {
        unitTests.all {
            // JUnit 4 (no useJUnitPlatform()).
            // Explicitly enable JaCoCo on each unit-test task so AGP writes
            // build/jacoco/<taskName>.exec which jacocoTestReport consumes.
            // Without isEnabled = true, no .exec files are produced and
            // jacocoTestReport fails with "No execution data found".
            jacoco {
                isEnabled = true
                includeNoLocationClasses = true
                // Robolectric/AGP stub classes are generated, not authored code.
                excludes = ['jdk.internal.*']
            }
        }
        unitTests.includeAndroidResources = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

jacoco {
    toolVersion = '0.8.11'
}

// Register the report explicitly because the Android unit-test task is not
// wired to a JaCoCo report task by the Java plugin.
tasks.register('jacocoTestReport', org.gradle.testing.jacoco.tasks.JacocoReport) {
    // Start enabled; onlyIf below controls whether execution actually happens.
    // NOTE: enabled=false causes Gradle to throw when the task is requested on
    // the CLI, so we keep enabled=true and rely on onlyIf to skip.
    enabled = true
    // Skip gracefully when no JaCoCo execution data exists (e.g. AGP did not
    // write .exec files for unit tests). Failing here blocks the whole CI
    // pipeline even though compilation and tests succeed.
    onlyIf {
        def jacocoDir = file("$buildDir/jacoco")
        jacocoDir.exists() && jacocoDir.listFiles()?.any { it.name.endsWith('.exec') } == true
    }
    dependsOn 'testDebugUnitTest'
    reports {
        xml.required = false
        html.required = false
        csv.required = false
    }
    executionData.setFrom(files(
            fileTree(dir: "$buildDir/jacoco", include: ['*.exec']),
            fileTree(dir: "$buildDir/intermediates/unit_test_coverage/debug", include: ['*.exec']),
            fileTree(dir: "$buildDir/intermediates/unit_test_coverage/release", include: ['*.exec']),
            fileTree(dir: "$buildDir/outputs/unit_test_coverage/debug", include: ['*.exec']),
            fileTree(dir: "$buildDir/outputs/unit_test_coverage/release", include: ['*.exec'])
    ))
    classDirectories.setFrom(files(
            fileTree(dir: "$buildDir/tmp/kotlin-classes/debug", exclude: [
                    '**/R.class',
                    '**/R$*.class',
                    '**/BuildConfig.*',
                    '**/Manifest*.*',
                    '**/*Test*.*'
            ])
    ))
    sourceDirectories.setFrom(files('src/main/java', 'src/main/kotlin'))
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.activity:activity-compose:1.8.0'
    implementation platform('androidx.compose:compose-bom:2023.08.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.webkit:webkit:1.12.0'
    implementation 'androidx.security:security-crypto:1.1.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'org.robolectric:robolectric:4.18'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
